[workspace]
members = [
    "crates/blockchain",
    "crates/runtime",
    "crates/storage",
    "crates/contracts-sdk",
    "crates/networking",
    "node",
    "tests-integration",
    "crates/contracts-sdk/examples/counter",
    "crates/contracts-sdk/examples/token",
    "crates/contracts-sdk/examples/tester",
    "crates/contracts-sdk/examples/simple_token",
]

# Only build main crates by default (exclude WASM contracts)
default-members = [
    "crates/blockchain",
    "crates/runtime",
    "crates/storage",
    "crates/contracts-sdk",
    "crates/networking",
    "node",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Wasmlette Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# WASM execution
wasmtime = "28"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Cryptography & hashing
blake3 = "1.5"
sha2 = "0.10"
ed25519-dalek = "2"
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1"

# Storage
sled = "0.34"

# Networking (optional)
tokio = { version = "1", features = ["full"] }
axum = "0.7"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Testing & benchmarks
criterion = "0.5"
proptest = "1"
