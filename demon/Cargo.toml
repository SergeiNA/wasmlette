[package]
name = "wasmlette-demon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "wasmlette"
path = "src/main.rs"

[dependencies]
wasmlette-blockchain = { path = "../crates/blockchain" }
wasmlette-runtime = { path = "../crates/runtime" }
wasmlette-node = { path = "../crates/node" }
#wasmlette-storage = { path = "../crates/storage" }
#wasmlette-networking = { path = "../crates/networking" }

# JSON-RPC server
jsonrpsee = { version = "0.22", features = ["server", "macros"] }
tokio = { version = "1", features = ["full"] }
hex = "0.4"

clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
